<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__TITLE__</title>
<style>
:root {
  --theme: #3b82f6;
  --theme-soft: rgba(59,130,246,.12);
  --bg: #f3f5f8;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --aside: #ffffff;
  --border: #e5e7eb;
  --shadow: 0 4px 16px rgba(15,23,42,.06);
  --radius: 12px;
  --aside-w: 180px;
  --hot: #f59e0b;
}
html.io-dark {
  --theme: #60a5fa;
  --theme-soft: rgba(96,165,250,.16);
  --bg: #121417;
  --card: #1c1f24;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --aside: #181b20;
  --border: #2a2f36;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
a { color: inherit; text-decoration: none; }
.layout { display: flex; min-height: 100vh; }
aside {
  position: sticky; top: 0; height: 100vh; width: var(--aside-w);
  flex: 0 0 var(--aside-w); background: var(--aside);
  border-right: 1px solid var(--border); padding: 16px 10px;
  display: flex; flex-direction: column; z-index: 20;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px 16px; font-weight: 700; font-size: 15px;
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 10px;
  background: linear-gradient(135deg,#6699cc,#479ac7 50%,#7dd3d8);
  color: #fff; display:grid; place-items:center; font-size: 14px;
}
.aside-nav { flex: 1; overflow: auto; padding-bottom: 12px; }
.aside-nav a {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; margin: 3px 0; border-radius: 10px;
  font-size: 13px; color: var(--muted); transition: .2s;
}
.aside-nav a:hover, .aside-nav a.active {
  background: var(--theme-soft); color: var(--theme); font-weight: 600;
}
.aside-nav a.hot { color: #d97706; }
html.io-dark .aside-nav a.hot { color: #fbbf24; }
.aside-foot { padding: 8px; border-top: 1px solid var(--border); }
.aside-foot button {
  width: 100%; border: 0; background: transparent; color: var(--muted);
  padding: 10px; border-radius: 10px; cursor: pointer; font-size: 13px;
}
.aside-foot button:hover { background: var(--theme-soft); color: var(--theme); }
main { flex: 1; min-width: 0; }
.banner {
  background-image: linear-gradient(45deg, #6699cc 0%, #479ac7 50%, #d5f3f4 100%);
  padding: 36px 24px 48px; position: relative;
}
html.io-dark .banner {
  background-image: linear-gradient(45deg, #1e3a5f 0%, #234e6d 50%, #1a3a42 100%);
}
.banner-inner { max-width: 920px; margin: 0 auto; }
.banner h1 {
  margin: 0 0 8px; color: #fff; font-size: 22px; font-weight: 700;
  text-shadow: 0 1px 8px rgba(0,0,0,.15);
}
.banner p { margin: 0 0 18px; color: rgba(255,255,255,.9); font-size: 13px; }
.search-wrap {
  background: rgba(255,255,255,.95); border-radius: 999px;
  display: flex; align-items: center; padding: 6px 6px 6px 18px;
  box-shadow: 0 10px 30px rgba(15,23,42,.12);
}
html.io-dark .search-wrap { background: rgba(28,31,36,.95); }
.search-wrap input {
  flex: 1; border: 0; outline: 0; background: transparent;
  font-size: 15px; padding: 10px 8px; color: var(--text);
}
.search-wrap button {
  border: 0; background: var(--theme); color: #fff;
  border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 600;
}
.engines { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.engines button {
  border: 0; background: rgba(255,255,255,.25); color: #fff;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 12px;
}
.engines button.active { background: rgba(255,255,255,.95); color: #1e3a5f; font-weight: 600; }
.content { padding: 28px 24px 48px; max-width: 1100px; margin: 0 auto; }
.section { margin-bottom: 28px; }
.section-head {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 16px; margin-bottom: 12px;
}
.section.hot-section .section-head { color: #d97706; }
html.io-dark .section.hot-section .section-head { color: #fbbf24; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.card {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px;
  box-shadow: var(--shadow); transition: .15s transform, .15s box-shadow;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15,23,42,.1); }
.card.hot-card { border-color: rgba(245,158,11,.35); }
.icon { width: 36px; height: 36px; border-radius: 10px; flex: 0 0 36px; }
.letter {
  width: 36px; height: 36px; border-radius: 10px; flex: 0 0 36px;
  display: grid; place-items: center; color: #fff; font-weight: 700;
}
.meta { min-width: 0; }
.title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.desc { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge {
  position: absolute; top: 6px; right: 8px;
  font-size: 10px; color: #b45309; background: rgba(245,158,11,.15);
  padding: 2px 6px; border-radius: 999px;
}
.empty { color: var(--muted); padding: 40px; text-align: center; }
.mobile-bar { display: none; }
@media (max-width: 800px) {
  aside { display: none; }
  .mobile-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--aside);
  }
}
</style>
</head>
<body>
<div class="mobile-bar">
  <strong>__TITLE__</strong>
  <button type="button" id="themeBtnMobile">主题</button>
</div>
<div class="layout">
  <aside>
    <div class="brand"><div class="brand-mark">导</div><span>__TITLE__</span></div>
    <nav class="aside-nav" id="asideNav"></nav>
    <div class="aside-foot"><button type="button" id="themeBtn">切换深色模式</button></div>
  </aside>
  <main>
    <div class="banner">
      <div class="banner-inner">
        <h1>__TITLE__</h1>
        <p id="statsLine">__STATS_LINE__</p>
        <div class="search-wrap">
          <input id="q" type="search" placeholder="筛选书签，或选择引擎后回车搜索" autocomplete="off" />
          <button type="button" id="go">搜索</button>
        </div>
        <div class="engines" id="engines">
          <button class="active" data-engine="filter">筛选</button>
          <button data-engine="https://www.google.com/search?q=%s%">Google</button>
          <button data-engine="https://www.baidu.com/s?wd=%s%">百度</button>
          <button data-engine="https://cn.bing.com/search?q=%s%">Bing</button>
          <button data-engine="https://www.zhihu.com/search?type=content&q=%s%">知乎</button>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<script>
const DATA = __DATA_JSON__;
const ICONS = __ICONS_JSON__;
const VISITS = __VISITS_JSON__;
const FREQUENT_LABEL = "__FREQUENT_LABEL__";

function favicon(url) {
  try {
    const u = new URL(url);
    if (u.protocol !== 'http:' && u.protocol !== 'https:') return '';
    return 'https://www.google.com/s2/favicons?sz=64&domain_url=' + encodeURIComponent(u.origin);
  } catch(e) { return ''; }
}
function letterAvatar(name) {
  const ch = (name || '?').trim().charAt(0).toUpperCase() || '?';
  const colors = ["#1abc9c","#2ecc71","#3498db","#9b59b6","#16a085","#27ae60","#2980b9","#8e44ad","#f1c40f","#e67e22","#e74c3c","#00bcd4","#f39c12","#d35400","#c0392b"];
  const color = colors[ch.charCodeAt(0) % colors.length];
  return {ch, color};
}
function hostOf(url) {
  try { return new URL(url).host.replace(/^www\./,'') || url; } catch(e) { return url; }
}
let engine = 'filter';
const content = document.getElementById('content');
const asideNav = document.getElementById('asideNav');
const q = document.getElementById('q');
function allItems() {
  const list = [];
  Object.keys(DATA).forEach(cat => DATA[cat].forEach(it => list.push({...it, cat})));
  return list;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(filterText='') {
  const ft = filterText.trim().toLowerCase();
  asideNav.innerHTML = '';
  content.innerHTML = '';
  let shown = 0;
  const cats = Object.keys(DATA);
  cats.forEach(cat => {
    let items = DATA[cat];
    if (ft) {
      items = items.filter(it =>
        (it.name||'').toLowerCase().includes(ft) ||
        (it.url||'').toLowerCase().includes(ft) ||
        (it.host||'').toLowerCase().includes(ft)
      );
    }
    if (!items.length) return;
    shown += items.length;
    const id = 'cat-' + encodeURIComponent(cat);
    const a = document.createElement('a');
    a.href = '#' + id;
    if (cat === FREQUENT_LABEL) a.classList.add('hot');
    a.innerHTML = `<span>${ICONS[cat]||'•'}</span><span>${cat} <small style="opacity:.7">(${items.length})</small></span>`;
    asideNav.appendChild(a);
    const section = document.createElement('section');
    section.className = 'section' + (cat === FREQUENT_LABEL ? ' hot-section' : '');
    section.id = id;
    const tip = cat === FREQUENT_LABEL ? ' · 按浏览器访问次数自动收录' : '';
    section.innerHTML = `<div class="section-head"><span>${ICONS[cat]||''}</span><span>${cat}</span><span style="font-weight:500;font-size:12px">· ${items.length}${tip}</span></div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach((it, idx) => {
      const card = document.createElement('a');
      card.className = 'card' + (cat === FREQUENT_LABEL ? ' hot-card' : '');
      card.href = it.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.title = it.name + '\n' + it.url;
      const fav = favicon(it.url);
      const la = letterAvatar(it.name);
      const iconHtml = fav
        ? `<img class="icon" src="${fav}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" /><div class="letter" style="display:none;background:${la.color}">${la.ch}</div>`
        : `<div class="letter" style="background:${la.color}">${la.ch}</div>`;
      let badge = '';
      if (cat === FREQUENT_LABEL) {
        const vc = VISITS[it.host] || VISITS[(it.host||'').replace(/^www\./,'')] || '';
        badge = `<span class="badge">#${idx+1}${vc ? ' · ' + vc + '次' : ''}</span>`;
      }
      card.innerHTML = `${badge}${iconHtml}<div class="meta"><div class="title">${escapeHtml(it.name)}</div><div class="desc">${escapeHtml(it.host || hostOf(it.url))}</div></div>`;
      grid.appendChild(card);
    });
    section.appendChild(grid);
    content.appendChild(section);
  });
  if (!shown) content.innerHTML = '<div class="empty">没有匹配的书签，换个关键词试试。</div>';
  const bookmarkCount = allItems().filter(i => i.cat !== FREQUENT_LABEL).length;
  const freqCount = (DATA[FREQUENT_LABEL] || []).length;
  document.getElementById('statsLine').textContent =
    `书签 ${bookmarkCount} · 高频站点 ${freqCount} · ${cats.length} 个分类` + (ft ? ` · 当前显示 ${shown} 个` : '');
}
function doSearch() {
  const text = q.value.trim();
  if (engine === 'filter' || !text) { render(text); return; }
  window.open(engine.replace('%s%', encodeURIComponent(text)), '_blank');
}
document.getElementById('engines').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#engines button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  engine = btn.dataset.engine;
  if (engine === 'filter') render(q.value);
});
q.addEventListener('input', () => { if (engine === 'filter') render(q.value); });
q.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
document.getElementById('go').addEventListener('click', doSearch);
function toggleTheme() {
  document.documentElement.classList.toggle('io-dark');
  localStorage.setItem('nav-theme', document.documentElement.classList.contains('io-dark') ? 'dark' : 'light');
}
document.getElementById('themeBtn').addEventListener('click', toggleTheme);
document.getElementById('themeBtnMobile').addEventListener('click', toggleTheme);
if (localStorage.getItem('nav-theme') === 'dark') document.documentElement.classList.add('io-dark');
render();
</script>
</body>
</html>
